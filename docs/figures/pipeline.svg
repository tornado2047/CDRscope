<text x="606" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B" font-family="monospace">FindMarkers</text>
<text x="606" y="124" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">统计 + 序列</text>

