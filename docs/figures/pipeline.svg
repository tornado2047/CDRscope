<svg viewBox="0 0 680 425" width="100%" role="img" aria-labelledby="pp ppd">
<title id="pp">CDRscope 算法 Pipeline 示意图</title>
<desc id="ppd">CDRscope 可解释 TCR/BCR 分析的横向 pipeline：输入→质控→六维特征→概念瓶颈嵌入与分类→生物标记，含六概念模块展开与可解释性保障</desc>
<defs>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">CDRscope 算法 Pipeline</text>
<text x="340" y="44" text-anchor="middle" font-size="13" fill="#5F5E5A">可解释 TCR/BCR 分析 · 六概念瓶颈架构</text>

<rect x="20" y="70" width="116" height="70" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<rect x="20" y="70" width="116" height="4" rx="2" fill="#1D9E75"/>
<text x="78" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#085041">① 输入</text>
<text x="78" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56" font-family="monospace">ReadRepertoire</text>
<text x="78" y="124" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">junction-aa · 七链</text>

<rect x="152" y="70" width="116" height="70" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="152" y="70" width="116" height="4" rx="2" fill="#888780"/>
<text x="210" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#444441">② 质控对齐</text>
<text x="210" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A" font-family="monospace">QCRepertoire</text>
<text x="210" y="124" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">CDR3 提取·过滤</text>

<rect x="284" y="70" width="116" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="284" y="70" width="116" height="4" rx="2" fill="#378ADD"/>
<text x="342" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#0C447C">③ 六维特征</text>
<text x="342" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="monospace">ComputeFeatures</text>
<text x="342" y="124" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">六概念轴 ↓</text>

<rect x="416" y="70" width="116" height="70" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<rect x="416" y="70" width="116" height="4" rx="2" fill="#534AB7"/>
<text x="474" y="88" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#3C3489">④ 嵌入分类</text>
<text x="474" y="106" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7" font-family="monospace">ConceptBottleneck</text>
<text x="474" y="124" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">logistic + SHAP</text>

<rect x="548" y="70" width="116" height="70" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
