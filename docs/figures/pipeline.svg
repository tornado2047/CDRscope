<text x="202" y="258" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">收敛 · 坍缩</text>

<rect x="275" y="226" width="130" height="42" rx="6" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<rect x="275" y="226" width="3" height="42" fill="#EF9F27"/>
<text x="342" y="242" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#633806">⑤ 历史谱系</text>
<text x="342" y="258" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">SHM (BCR)</text>

<rect x="415" y="226" width="130" height="42" rx="6" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
<rect x="415" y="226" width="3" height="42" fill="#534AB7"/>
<text x="482" y="242" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#3C3489">⑥ 跨链耦合</text>
<text x="482" y="258" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">配对多样性</text>

<path d="M560 272 L560 105 L548 105" fill="none" stroke="#378ADD" stroke-width="0.8" stroke-dasharray="3 2"/>

<rect x="20" y="288" width="644" height="30" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="342" y="303" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">可解释性保障：语义特征工程 · 概念瓶颈约束 · 线性可解 + SHAP 归因 · 双层标记互证</text>

<rect x="20" y="330" width="310" height="80" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
<text x="175" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#712B13">输出 ① 疾病分离</text>
<text x="175" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">概念空间中疾病可分</text>
<text x="175" y="388" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">决策边界追溯至概念轴</text>

<rect x="354" y="330" width="310" height="80" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5"/>
<text x="509" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">输出 ② 生物标记</text>
<text x="509" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">统计级：特征差异 + FDR</text>
<text x="509" y="388" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">序列级：motif 富集 + 共享克隆型</text>

