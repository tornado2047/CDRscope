<text x="202" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">motif 频谱</text>

<rect x="275" y="178" width="130" height="42" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<rect x="275" y="178" width="3" height="42" fill="#1D9E75"/>
<text x="342" y="194" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#085041">② 空间统计</text>
<text x="342" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Shannon · power-law</text>

<rect x="415" y="178" width="130" height="42" rx="6" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<rect x="415" y="178" width="3" height="42" fill="#639922"/>
