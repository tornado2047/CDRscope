<text x="482" y="210" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#3B6D11">N 插入 · 电荷</text>

<rect x="135" y="226" width="130" height="42" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
